name: Validate negocio client JSON

on:
  push:
    paths:
      - 'negocio/_data/**'
      - 'negocio/_schema/**'
  pull_request:
    paths:
      - 'negocio/_data/**'
      - 'negocio/_schema/**'

jobs:
  ajv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate each client JSON
        run: |
          set -e
          for f in negocio/_data/*.json; do
            base=$(basename "$f")
            if [[ "$base" == _* ]]; then
              echo "Skip template $f"
              continue
            fi
            echo "Validating $f"
            npx --yes ajv-cli@5 validate -s negocio/_schema/card.schema.json -d "$f" --allow-union-types
          done
