name: Weekly SEO audit

# Runs scripts/seo-audit.mjs every Monday against the site's static HTML
# pages (title/meta description/canonical/H1/alt text/JSON-LD schema/
# sitemap-pages.xml presence). No API keys needed — it's pure local file
# analysis, unlike leadgen-weekly.yml's Google Places/PageSpeed calls.
# The job fails (red X in the Actions tab) whenever the script finds an
# issue, so a new page added without a title/meta description/schema
# gets caught here instead of silently shipping. Warnings (title/meta
# length, etc.) don't fail the job — see scripts/seo-audit.mjs's exit
# code logic.

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch: {}

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run seo:audit
