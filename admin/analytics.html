<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GABAN Admin — Analytics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f6f6f4;
      color: #1a1a1a; padding: 1.25rem; max-width: 640px; margin: 0 auto;
    }
    h1 { font-size: 1.3rem; margin: 1rem 0 0.25rem; }
    h2 { font-size: 0.95rem; margin: 1.75rem 0 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; }
    p.sub { color: #666; font-size: 0.9rem; margin: 0 0 1rem; }
    a { color: #0b3d63; }
    .range-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .range-btn {
      flex: 1; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px; background: #fff;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #444;
    }
    .range-btn.active { background: #111; color: #fff; border-color: #111; }
    .totals-row { display: flex; gap: 0.75rem; margin: 1rem 0; }
    .stat-tile {
      flex: 1; padding: 1rem; border-radius: 10px; background: #fff; border: 1px solid #eee; text-align: center;
    }
    .stat-tile .n { font-size: 1.6rem; font-weight: 800; }
    .stat-tile .l { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.03em; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
    th, td { padding: 0.6rem 0.75rem; text-align: left; font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; }
    th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.03em; }
    tr:last-child td { border-bottom: none; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { color: #888; font-size: 0.85rem; padding: 1rem; text-align: center; }
    .chart-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 1rem; margin: 1rem 0; position: relative; }
    .chart-legend { display: flex; gap: 1rem; font-size: 0.75rem; color: #666; margin-bottom: 0.5rem; }
    .chart-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.3rem; }
    .chart-legend .dot.pv { background: #111; }
    .chart-legend .dot.vs { background: #0b3d63; }
    .chart-svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
    .chart-area { fill: rgba(17, 17, 17, 0.06); stroke: none; }
    .chart-line { fill: none; stroke-width: 2; }
    .chart-line.pv { stroke: #111; }
    .chart-line.vs { stroke: #0b3d63; }
    .chart-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: #999; margin-top: 0.4rem; }
    .chart-guide { stroke: #ccc; stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; opacity: 0; }
    .chart-guide.active { opacity: 1; }
    .chart-dot { transition: r 0.1s ease; }
    .chart-dot.active { r: 4.5; }
    .chart-hit { fill: transparent; cursor: pointer; }
    .chart-tooltip {
      position: absolute; top: 0; left: 0; transform: translate(-50%, calc(-100% - 10px));
      background: #111; color: #fff; font-size: 0.75rem; line-height: 1.4; padding: 0.5rem 0.65rem;
      border-radius: 8px; pointer-events: none; white-space: nowrap; z-index: 5;
      opacity: 0; transition: opacity 0.1s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .chart-tooltip.show { opacity: 1; }
    .chart-tooltip .tt-date { font-weight: 700; margin-bottom: 0.25rem; }
    .chart-tooltip .tt-row { display: flex; align-items: center; gap: 0.35rem; }
    .chart-tooltip .tt-row .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
    .chart-tooltip .tt-row .dot.pv { background: #fff; }
    .chart-tooltip .tt-row .dot.vs { background: #6ea8d8; }
    .setup-notice {
      padding: 1.25rem; border-radius: 10px; background: #fff8ea; border: 1px solid #e0a72e; font-size: 0.88rem;
    }
    .setup-notice code { background: #f0e6cf; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.82rem; }
    .loading { color: #888; font-size: 0.9rem; padding: 2rem 0; text-align: center; }
  </style>
  <script src="/admin/auth.js"></script>
</head>
<body>
  <p class="sub"><a href="/admin">&larr; Admin home</a></p>
  <h1>Analytics</h1>
  <p class="sub">Traffic from Vercel Web Analytics (first-party, no cookies).</p>

  <div class="range-row" id="rangeRow">
    <button class="range-btn" data-days="7">7 days</button>
    <button class="range-btn active" data-days="30">30 days</button>
    <button class="range-btn" data-days="90">90 days</button>
  </div>

  <div id="content">
    <div class="loading">Loading…</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    async function callJson(path) {
      const res = await fetch(path, { credentials: "include" });
      return res.json();
    }

    function renderTable(rows, dimensionKey, dimensionLabel) {
      if (!rows || !rows.length) {
        return `<div class="empty">No data yet for this range.</div>`;
      }
      const body = rows.map((r) => `
        <tr>
          <td>${escapeHtml(r[dimensionKey] || "(none)")}</td>
          <td class="num">${escapeHtml(r.pageviews ?? r.count ?? 0)}</td>
          <td class="num">${escapeHtml(r.visitors ?? "—")}</td>
        </tr>`).join("");
      return `
        <table>
          <thead><tr><th>${escapeHtml(dimensionLabel)}</th><th class="num">Views</th><th class="num">Visitors</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    // Populated by buildEvolutionChart, read by the delegated tap/click
    // handler below (chart is re-rendered as an HTML string on every
    // range change, so we can't close over local vars for the handler).
    let chartPoints = [];

    function buildEvolutionChart(rows) {
      if (!rows || rows.length < 2) {
        chartPoints = [];
        return `<div class="empty">Not enough data yet to chart.</div>`;
      }
      const sorted = [...rows].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const w = 640, h = 220, padL = 12, padR = 12, padT = 16, padB = 12;
      const innerW = w - padL - padR, innerH = h - padT - padB;
      const maxVal = Math.max(1, ...sorted.map((r) => Math.max(r.pageviews || 0, r.visitors || 0)));
      const stepX = sorted.length > 1 ? innerW / (sorted.length - 1) : 0;
      const x = (i) => padL + i * stepX;
      const y = (v) => padT + innerH - (v / maxVal) * innerH;

      const linePath = (key) => sorted.map((r, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(r[key] || 0).toFixed(1)}`).join(" ");
      const areaPath = (key) => `${linePath(key)} L${x(sorted.length - 1).toFixed(1)},${(padT + innerH).toFixed(1)} L${x(0).toFixed(1)},${(padT + innerH).toFixed(1)} Z`;

      const fmt = (ts) => new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });

      chartPoints = sorted.map((r, i) => ({
        i, x: x(i), yPv: y(r.pageviews || 0), yVs: y(r.visitors || 0),
        date: fmt(r.timestamp), pageviews: r.pageviews ?? 0, visitors: r.visitors ?? 0
      }));

      const dots = (key, color) => sorted.map((r, i) => `<circle class="chart-dot" data-i="${i}" data-series="${key}" cx="${x(i).toFixed(1)}" cy="${y(r[key] || 0).toFixed(1)}" r="2.5" fill="${color}"></circle>`).join("");

      const hitW = Math.max(stepX, 12);
      const hitTargets = sorted.map((r, i) => `<rect class="chart-hit" data-i="${i}" x="${(x(i) - hitW / 2).toFixed(1)}" y="${padT}" width="${hitW.toFixed(1)}" height="${innerH}"></rect>`).join("");

      const guides = sorted.map((r, i) => `<line class="chart-guide" data-i="${i}" x1="${x(i).toFixed(1)}" y1="${padT}" x2="${x(i).toFixed(1)}" y2="${(padT + innerH).toFixed(1)}"></line>`).join("");

      return `
        <div class="chart-card">
          <div class="chart-legend">
            <span><i class="dot pv"></i>Pageviews</span>
            <span><i class="dot vs"></i>Visitors</span>
          </div>
          <svg viewBox="0 0 ${w} ${h}" class="chart-svg" id="chartSvg">
            <path d="${areaPath("pageviews")}" class="chart-area"></path>
            <path d="${linePath("pageviews")}" class="chart-line pv"></path>
            <path d="${linePath("visitors")}" class="chart-line vs"></path>
            ${guides}
            ${dots("pageviews", "#111")}
            ${dots("visitors", "#0b3d63")}
            ${hitTargets}
          </svg>
          <div class="chart-axis">
            <span>${escapeHtml(fmt(sorted[0].timestamp))}</span>
            <span>${escapeHtml(fmt(sorted[sorted.length - 1].timestamp))}</span>
          </div>
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>`;
    }

    function selectChartPoint(index) {
      const point = chartPoints[index];
      const card = document.querySelector(".chart-card");
      const tooltip = $("chartTooltip");
      if (!point || !card || !tooltip) return;

      card.querySelectorAll(".chart-dot.active").forEach((el) => el.classList.remove("active"));
      card.querySelectorAll(`.chart-dot[data-i="${index}"]`).forEach((el) => el.classList.add("active"));
      card.querySelectorAll(".chart-guide.active").forEach((el) => el.classList.remove("active"));
      const guide = card.querySelector(`.chart-guide[data-i="${index}"]`);
      if (guide) guide.classList.add("active");

      tooltip.innerHTML = `
        <div class="tt-date">${escapeHtml(point.date)}</div>
        <div class="tt-row"><i class="dot pv"></i>${escapeHtml(point.pageviews)} pageviews</div>
        <div class="tt-row"><i class="dot vs"></i>${escapeHtml(point.visitors)} visitors</div>`;

      const svg = $("chartSvg");
      const svgRect = svg.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const scale = svgRect.width / 640;
      const rawLeft = svgRect.left - cardRect.left + point.x * scale;
      const top = svgRect.top - cardRect.top + Math.min(point.yPv, point.yVs) * scale;
      const halfWidth = tooltip.getBoundingClientRect().width / 2;
      const left = Math.min(Math.max(rawLeft, halfWidth + 4), cardRect.width - halfWidth - 4);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
      tooltip.classList.add("show");
    }

    function hideChartTooltip() {
      const tooltip = $("chartTooltip");
      if (tooltip) tooltip.classList.remove("show");
      document.querySelectorAll(".chart-dot.active").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".chart-guide.active").forEach((el) => el.classList.remove("active"));
    }

    // Delegated on #content (which persists across re-renders) so taps
    // keep working after each range switch replaces the chart markup.
    $("content").addEventListener("click", (event) => {
      const hit = event.target.closest(".chart-hit");
      if (hit) {
        event.stopPropagation();
        selectChartPoint(Number(hit.dataset.i));
      }
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".chart-card")) hideChartTooltip();
    });

    function renderDashboard(data) {
      const totals = data.totals || {};
      return `
        <div class="totals-row">
          <div class="stat-tile"><div class="n">${escapeHtml(totals.pageviews ?? 0)}</div><div class="l">Pageviews</div></div>
          <div class="stat-tile"><div class="n">${escapeHtml(totals.visitors ?? 0)}</div><div class="l">Visitors</div></div>
        </div>

        <h2>Evolution</h2>
        ${buildEvolutionChart(data.byDate)}

        <h2>Top pages</h2>
        ${renderTable(data.byPath, "requestPath", "Path")}

        <h2>Top referrers</h2>
        ${renderTable(data.byReferrer, "referrerHostname", "Source")}

        <h2>Top countries</h2>
        ${renderTable(data.byCountry, "country", "Country")}

        <h2>Devices</h2>
        ${renderTable(data.byDevice, "deviceType", "Device")}
      `;
    }

    function renderSetupNotice(message) {
      return `
        <div class="setup-notice">
          <strong>Not showing data yet.</strong><br><br>
          ${escapeHtml(message)}
        </div>`;
    }

    async function loadAnalytics(days) {
      $("content").innerHTML = `<div class="loading">Loading…</div>`;
      try {
        const data = await callJson(`/api/admin/analytics?days=${days}`);
        if (!data.ok) {
          $("content").innerHTML = renderSetupNotice(data.error || "Something went wrong.");
          return;
        }
        if (!data.enabled) {
          $("content").innerHTML = renderSetupNotice(data.message);
          return;
        }
        $("content").innerHTML = renderDashboard(data);
      } catch (err) {
        $("content").innerHTML = renderSetupNotice(err.message);
      }
    }

    document.querySelectorAll(".range-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        loadAnalytics(btn.dataset.days);
      });
    });

    adminReady.then(() => loadAnalytics(30));
  </script>
</body>
</html>
