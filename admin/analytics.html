<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GABAN Admin — Analytics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f6f6f4;
      color: #1a1a1a; padding: 1.25rem; max-width: 640px; margin: 0 auto;
    }
    h1 { font-size: 1.3rem; margin: 1rem 0 0.25rem; }
    h2 { font-size: 0.95rem; margin: 1.75rem 0 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; }
    p.sub { color: #666; font-size: 0.9rem; margin: 0 0 1rem; }
    a { color: #0b3d63; }
    .range-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .range-btn {
      flex: 1; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px; background: #fff;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #444;
    }
    .range-btn.active { background: #111; color: #fff; border-color: #111; }
    .totals-row { display: flex; gap: 0.75rem; margin: 1rem 0; }
    .stat-tile {
      flex: 1; padding: 1rem; border-radius: 10px; background: #fff; border: 1px solid #eee; text-align: center;
    }
    .stat-tile .n { font-size: 1.6rem; font-weight: 800; }
    .stat-tile .l { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.03em; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
    th, td { padding: 0.6rem 0.75rem; text-align: left; font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; }
    th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.03em; }
    tr:last-child td { border-bottom: none; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { color: #888; font-size: 0.85rem; padding: 1rem; text-align: center; }
    .setup-notice {
      padding: 1.25rem; border-radius: 10px; background: #fff8ea; border: 1px solid #e0a72e; font-size: 0.88rem;
    }
    .setup-notice code { background: #f0e6cf; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.82rem; }
    .loading { color: #888; font-size: 0.9rem; padding: 2rem 0; text-align: center; }
  </style>
  <script src="/admin/auth.js"></script>
</head>
<body>
  <p class="sub"><a href="/admin">&larr; Admin home</a></p>
  <h1>Analytics</h1>
  <p class="sub">Traffic from Vercel Web Analytics (first-party, no cookies).</p>

  <div class="range-row" id="rangeRow">
    <button class="range-btn" data-days="7">7 days</button>
    <button class="range-btn active" data-days="30">30 days</button>
    <button class="range-btn" data-days="90">90 days</button>
  </div>

  <div id="content">
    <div class="loading">Loading…</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    async function callJson(path) {
      const res = await fetch(path, { credentials: "include" });
      return res.json();
    }

    function renderTable(rows, dimensionKey, dimensionLabel) {
      if (!rows || !rows.length) {
        return `<div class="empty">No data yet for this range.</div>`;
      }
      const body = rows.map((r) => `
        <tr>
          <td>${escapeHtml(r[dimensionKey] || "(none)")}</td>
          <td class="num">${escapeHtml(r.pageviews ?? r.count ?? 0)}</td>
          <td class="num">${escapeHtml(r.visitors ?? "—")}</td>
        </tr>`).join("");
      return `
        <table>
          <thead><tr><th>${escapeHtml(dimensionLabel)}</th><th class="num">Views</th><th class="num">Visitors</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    function renderDashboard(data) {
      const totals = data.totals || {};
      return `
        <div class="totals-row">
          <div class="stat-tile"><div class="n">${escapeHtml(totals.pageviews ?? 0)}</div><div class="l">Pageviews</div></div>
          <div class="stat-tile"><div class="n">${escapeHtml(totals.visitors ?? 0)}</div><div class="l">Visitors</div></div>
        </div>

        <h2>Top pages</h2>
        ${renderTable(data.byPath, "requestPath", "Path")}

        <h2>Top referrers</h2>
        ${renderTable(data.byReferrer, "referrerHostname", "Source")}

        <h2>Top countries</h2>
        ${renderTable(data.byCountry, "country", "Country")}

        <h2>Devices</h2>
        ${renderTable(data.byDevice, "deviceType", "Device")}
      `;
    }

    function renderSetupNotice(message) {
      return `
        <div class="setup-notice">
          <strong>Not showing data yet.</strong><br><br>
          ${escapeHtml(message)}
        </div>`;
    }

    async function loadAnalytics(days) {
      $("content").innerHTML = `<div class="loading">Loading…</div>`;
      try {
        const data = await callJson(`/api/admin/analytics?days=${days}`);
        if (!data.ok) {
          $("content").innerHTML = renderSetupNotice(data.error || "Something went wrong.");
          return;
        }
        if (!data.enabled) {
          $("content").innerHTML = renderSetupNotice(data.message);
          return;
        }
        $("content").innerHTML = renderDashboard(data);
      } catch (err) {
        $("content").innerHTML = renderSetupNotice(err.message);
      }
    }

    document.querySelectorAll(".range-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        loadAnalytics(btn.dataset.days);
      });
    });

    adminReady.then(() => loadAnalytics(30));
  </script>
</body>
</html>
